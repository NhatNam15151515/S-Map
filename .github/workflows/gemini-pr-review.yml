name: Gemini AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main, dev-w1, dev-w2, dev-w3, dev-w4, dev-w5, dev-w6, dev-w7, dev-w8]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gemini-review:
    name: Gemini AI Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Generate PR Diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.patch

      - name: Run Gemini Review Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python .github/scripts/gemini_review.py
