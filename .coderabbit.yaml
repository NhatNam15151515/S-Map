# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "vi"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: |
    ## 🤖 AI Review

    **MR**: #{pr_number}

    ### Kết luận
    {summary_verdict}

    ### Findings
    {findings_list}

    ### Test nên chạy
    {test_suggestions}

    ### Ghi chú scope
    {scope_notes}
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    # Chỉ review 1 lần khi tạo PR, KHÔNG review lại khi push thêm commit
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"
    base_branches:
      - main
      - dev-w1
      - dev-w2
      - dev-w3
      - dev-w4
      - dev-w5
      - dev-w6
      - dev-w7
      - dev-w8
  tools:
    github-checks:
      enabled: true
  path_instructions:
    - path: "**"
      instructions: |
        QUAN TRỌNG: Hãy review code và trả lời theo format sau:

        ## Kết luận
        Chọn 1 trong: PASS | PASS_WITH_NOTES | NEEDS_CHANGES | REJECT
        Giải thích ngắn gọn lý do.

        ## Findings
        Liệt kê các phát hiện theo format:
        - [Mức độ: Critical/High/Medium/Low] Mô tả vấn đề. Nếu có, gợi ý fix.

        ## Test nên chạy
        Liệt kê các test case cần kiểm tra cho thay đổi này.

        ## Ghi chú scope
        Nhận xét về scope của PR: có phù hợp không, có cần tách nhỏ không.
    - path: "lib/commons/cubits/**"
      instructions: |
        Review Cubit/Bloc implementations:
        - All Cubits/Blocs MUST override emit() with: @override void emit(state) { if (isClosed) return; super.emit(state); }
        - Use Cubit by default. Only use Bloc when event transformers (restartable, droppable, sequential) are needed.
        - Check for proper state immutability (Equatable or freezed).
    - path: "lib/services/**"
      instructions: |
        Review service implementations:
        - Services should be singleton or injected via repository pattern.
        - Native bridge services must handle MethodChannel errors gracefully.
    - path: "android/**"
      instructions: |
        Review Android native code:
        - Check ProGuard/R8 rules for GraphHopper reflection.
        - Verify MethodChannel handler registration.
    - path: "pubspec.yaml"
      instructions: |
        Review dependency changes:
        - Warn if adding dependencies not listed in the project BRD.
        - Check for version conflicts.
chat:
  auto_reply: true
