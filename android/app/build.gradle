plugins {
    id "com.android.application"
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def env = [
        DISPLAY_NAME: 'S-Map',
        FLUTTER_BUILD_NAME: '1.0.0',
        FLUTTER_BUILD_NUMBER_ANDROID: '1',
        BUNDLE_ID: 'com.vnsmap.app',
        FLAVOR: 'dev',
]

if (project.hasProperty('dart-defines')) {
    env = env + project.property('dart-defines')
            .split(',')
            .collectEntries { entry ->
                def pair = new String(entry.decodeBase64(), 'UTF-8').split('=')
                [(pair.first()): pair.last()]
            }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.vnsmap.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.res.srcDirs = ['src/'+ env.FLAVOR + '/res', 'src/main/res']
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId env.BUNDLE_ID
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 24
        targetSdkVersion 34
        versionCode env.FLUTTER_BUILD_NUMBER_ANDROID.toInteger()
        versionName env.FLUTTER_BUILD_NAME
        resValue "string", "app_name", env.DISPLAY_NAME
    }

    signingConfigs {
        release {
            if (keystoreProperties['storeFile'] != null && file(keystoreProperties['storeFile']).exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            } else {
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword 'android'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def flavorName = env.FLAVOR
            def displayName = env.DISPLAY_NAME
            outputFileName = "$displayName-$flavorName-v${variant.versionName.replaceAll("[.]","")}c${versionCode}.apk"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation('com.graphhopper:graphhopper-core:8.0') {
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
    }
    implementation 'org.slf4j:slf4j-android:1.7.36'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.15.0'
        force 'androidx.core:core-ktx:1.15.0'
    }
}

tasks.register('autoPushGraphData') {
    doLast {
        def sdkDir = android.sdkDirectory.path
        def adbExecutable = new File(sdkDir, "platform-tools/adb" + (org.gradle.internal.os.OperatingSystem.current().isWindows() ? ".exe" : ""))
        if (!adbExecutable.exists()) return

        try {
            def devicesOutput = new ByteArrayOutputStream()
            exec {
                commandLine adbExecutable.path, 'devices'
                standardOutput = devicesOutput
                ignoreExitValue = true
            }
            def outputStr = devicesOutput.toString()
            if (outputStr.contains("\tdevice")) {
                println "📱 [S-Map Gradle] Checking GraphHopper map data on connected device..."
                
                def checkOutput = new ByteArrayOutputStream()
                exec {
                    commandLine adbExecutable.path, 'shell', 'ls /sdcard/Android/data/com.vnsmap.app/files/metro_hcm_extracted/nodes 2>/dev/null'
                    standardOutput = checkOutput
                    ignoreExitValue = true
                }
                
                if (!checkOutput.toString().contains("nodes")) {
                    println "⚠️ [S-Map Gradle] GraphHopper data MISSING on device! Auto-pushing graph data..."
                    def graphDir = file("../../data-pipeline/data/graph-cache/metro_hcm")
                    if (graphDir.exists()) {
                        exec {
                            commandLine adbExecutable.path, 'shell', 'mkdir -p /sdcard/Android/data/com.vnsmap.app/files/metro_hcm_extracted'
                            ignoreExitValue = true
                        }
                        exec {
                            commandLine adbExecutable.path, 'push', "${graphDir.path}/.", '/sdcard/Android/data/com.vnsmap.app/files/metro_hcm_extracted/'
                        }
                        println "✅ [S-Map Gradle] GraphHopper data successfully pushed to device!"
                    } else {
                        println "⚠️ [S-Map Gradle] Graph data cache not found at ${graphDir.path}. Skipping auto-push."
                    }
                } else {
                    println "✅ [S-Map Gradle] GraphHopper data already exists on device."
                }
            }
        } catch (Exception e) {
            println "⚠️ [S-Map Gradle] autoPushGraphData warning: ${e.message}"
        }
    }
}

tasks.matching { it.name.startsWith("assemble") || it.name.startsWith("install") }.configureEach {
    finalizedBy 'autoPushGraphData'
}


